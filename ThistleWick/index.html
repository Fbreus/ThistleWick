<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="ThistleWick is a woodland voxel sandbox with deep procedural caves and glowing crystals."
    />
    <meta name="theme-color" content="#08110f" />
    <title>ThistleWick - Voxel Sandbox</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Only the page background is inlined. Everything else is owned by
      `src/styles/main.css`, which Vite emits as a render-blocking <link> in the
      built page — so the card below is already styled before any JavaScript
      runs. The inline rule only exists to prevent a white flash on slow
      connections, where the stylesheet has not arrived yet.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #08110f;
      }
    </style>
  </head>
  <body>
    <!--
      The loading card is static markup rather than something JavaScript builds.
      Vite loads the application bundle as a module, so a JS-created overlay
      would leave the player staring at a blank page for as long as the bundle
      takes to download and parse. `BootOverlay` adopts this element and replaces
      it on the first stage update, which is why the classes and test id match
      the generated markup exactly.
    -->
    <div id="app" data-testid="app-root">
      <div class="boot-screen boot-screen--loading" data-testid="boot-loading">
        <div class="boot-screen__card">
          <h1 class="boot-screen__title">ThistleWick</h1>
          <p class="boot-screen__message">Waking the world...</p>
          <div class="boot-screen__progress" hidden>
            <div class="boot-screen__progress-fill"></div>
          </div>
        </div>
      </div>
    </div>

    <noscript>
      <div class="boot-screen boot-screen--fatal">
        <h1>JavaScript is required</h1>
        <p>ThistleWick runs in your browser. Enable JavaScript and reload this page.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
